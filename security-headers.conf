# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# connect-src is the list of hosts the app actually talks to: RCSB for
# structures and search, OpenRouter for the assistant. style-src needs
# 'unsafe-inline' because KaTeX writes inline style attributes; blob: worker and
# image sources cover the loader worker and the runtime font atlas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://data.rcsb.org https://search.rcsb.org https://models.rcsb.org https://files.rcsb.org https://openrouter.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
