# MolView is a personal project published to be read and run, not developed
# collaboratively. Pull requests are closed on arrival rather than left to go
# stale — an unanswered PR wastes more of a contributor's time than a refusal.

name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Explain and close
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thanks for taking the time to open this.',
              '',
              'MolView does not accept pull requests — it is a personal project, and',
              'this is automatic rather than a judgement on the change. Fork it on',
              'GitHub and take it wherever you like.',
              '',
              'If you have found a bug or something that reads wrong, an issue is the',
              'right place, and is read.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed',
            });
